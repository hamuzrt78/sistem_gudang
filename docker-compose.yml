version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sistem-gudang-app
    container_name: sistem-gudang-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      # Variabel env database agar connect ke container db
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=sistem_gudang
      - DB_USERNAME=gudang_user
      - DB_PASSWORD=gudang_secret
    depends_on:
      - db
    networks:
      - gudang-network
    volumes:
      # Mount .env dan folder storage agar persistent (opsional)
      - ./.env:/var/www/html/.env
      - storage-data:/var/www/html/storage

  db:
    image: mysql:8.0
    container_name: sistem-gudang-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sistem_gudang
      MYSQL_USER: gudang_user
      MYSQL_PASSWORD: gudang_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - gudang-network

networks:
  gudang-network:
    driver: bridge

volumes:
  db-data:
  storage-data:
